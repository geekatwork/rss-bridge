name: Feature request
description: Propose an improvement with clear acceptance criteria.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need without private source content or credentials.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include relevant alternatives and compatibility or operational impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable outcomes and how they can be verified.
    validations:
      required: true
