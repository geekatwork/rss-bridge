name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build tests
        run: npm run test:build

      - name: Unit tests
        run: npm run test:unit

      - name: Database failure and recovery tests
        run: npm run test:database

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Docker production images
        run: npm run test:docker-images

      - name: Existing-volume database migrations
        run: npm run test:migrations

      - name: Facebook retention policy
        run: npm run test:retention

      - name: Offline volume migration safety
        run: npm run test:volume-migration

      - name: Smoke tests
        run: npm run test:smoke

      - name: Reject broken scraper configuration
        run: |
          if npm run test:smoke -- --broken-config; then
            echo "Broken scraper configuration unexpectedly passed" >&2
            exit 1
          fi
