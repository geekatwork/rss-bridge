services:
  db:
    container_name: rss-bridge-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss_bridge}
      POSTGRES_USER: ${POSTGRES_USER:-rss_bridge}
      POSTGRES_PASSWORD:
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rss_bridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  feed-generator:
    container_name: rss-bridge-feed-generator
    build:
      context: .
      dockerfile: packages/feed-generator/Dockerfile
    restart: unless-stopped
    ports:
      - "${FEED_PORT:-3100}:80"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rss_bridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rss_bridge}
      PORT: 80
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      DB_QUERY_TIMEOUT_MS: ${FEED_DB_QUERY_TIMEOUT_MS:-10000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - rss-bridge

  scraper:
    container_name: rss-bridge-scraper
    build:
      context: .
      dockerfile: packages/scraper/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      SCRAPER_HEALTH_PORT: ${SCRAPER_HEALTH_PORT:-8081}
      SCRAPER_RUNTIME_DIAGNOSTICS: ${SCRAPER_RUNTIME_DIAGNOSTICS:-false}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      DB_QUERY_TIMEOUT_MS: ${SCRAPER_DB_QUERY_TIMEOUT_MS:-30000}
      DATABASE_URL: postgres://${POSTGRES_USER:-rss_bridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rss_bridge}
      SCRAPE_GROUPS: ${SCRAPE_GROUPS}
      SCRAPE_SCHEDULE: ${SCRAPE_SCHEDULE:-0 */2 * * *}
      PRUNE_SCHEDULE: ${PRUNE_SCHEDULE:-0 3 * * *}
      PRUNE_RETENTION_DAYS: ${PRUNE_RETENTION_DAYS:-7}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    volumes:
      - ./cookies:/app/cookies:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${SCRAPER_HEALTH_PORT:-8081}/health').then(r => { process.exitCode = r.ok ? 0 : 1; }).catch(e => { console.error(e); process.exitCode = 1; })"]
      interval: 30s
      timeout: ${SCRAPER_HEALTHCHECK_TIMEOUT:-40s}
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    container_name: rss-bridge-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: rss-bridge_pgdata
  pgadmin-data:

networks:
  rss-bridge:
    external: true
  default:
