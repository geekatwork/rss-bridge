services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: migration_test
      POSTGRES_PASSWORD: migration-test-only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "migration_test", "-d", "migration_test"]
      interval: 1s
      timeout: 2s
      retries: 30

networks:
  default:
    internal: true
